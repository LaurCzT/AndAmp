<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winamp Classic</title>
    <script src="webamp.bundle.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
        }
        #webamp-container {
            width: 100%;
            overflow: hidden;
        }
        #webamp-app {
            position: relative;
            width: 275px;
            transform-origin: top left !important;
        }
    </style>
</head>
<body>
    <div id="webamp-container">
        <div id="webamp-app"></div>
    </div>

    <script>
        let webampInstance = null;

        document.addEventListener("DOMContentLoaded", function () {
            if (typeof Webamp === "undefined") {
                console.error("Webamp SDK failed to load");
                return;
            }

            webampInstance = new Webamp({
                initialTracks: [
                    {
                        metaData: {
                            artist: "DJ Mike Llama",
                            title: "Llama Whippin' Intro"
                        },
                        url: "https://cdn.jsdelivr.net/gh/captbaritone/webamp@452349d9000fc7984024a1b026c11a68f448c414/demo/mp3/llama-2.91.mp3"
                    }
                ]
            });

            webampInstance.renderWhenReady(document.getElementById("webamp-app")).then(() => {
                console.log("Webamp rendered successfully");

                scaleWebamp();
                window.addEventListener("resize", scaleWebamp);
                setInterval(scaleWebamp, 500);

                document.body.addEventListener("touchstart", unlockAudio, { once: true });
                document.body.addEventListener("click", unlockAudio, { once: true });

                if (window.AndroidBridge && window.AndroidBridge.onWebampReady) {
                    window.AndroidBridge.onWebampReady();
                }

                webampInstance.onTrackDidChange((track) => {
                    if (track && track.metaData) {
                        const title = track.metaData.title || "Track";
                        const artist = track.metaData.artist || "Unknown Artist";
                        if (window.AndroidBridge && window.AndroidBridge.onTrackChanged) {
                            window.AndroidBridge.onTrackChanged(title, artist);
                        }
                    }
                });

                webampInstance.onWillStateChange((state) => {
                    if (window.AndroidBridge && window.AndroidBridge.onPlaybackStateChanged) {
                        const isPlaying = state.status === "PLAYING";
                        window.AndroidBridge.onPlaybackStateChanged(isPlaying);
                    }
                });
            });
        });

        function unlockAudio() {
            if (webampInstance) {
                webampInstance.play();
            }
        }

        function scaleWebamp() {
            const appEl = document.getElementById("webamp-app");
            if (!appEl) return;
            const screenW = window.innerWidth;
            if (screenW > 0) {
                const scale = screenW / 275;
                appEl.style.transform = `scale(${scale})`;
            }
        }

        function addTrackToWebamp(title, artist, audioUrl) {
            if (webampInstance) {
                webampInstance.appendTracks([
                    {
                        metaData: { title: title, artist: artist },
                        url: audioUrl
                    }
                ]);
            }
        }

        function clearWebampPlaylist() {
            if (webampInstance) {
                webampInstance.setTracksToPlay([]);
            }
        }

        function playWebamp() {
            if (webampInstance) webampInstance.play();
        }

        function pauseWebamp() {
            if (webampInstance) webampInstance.pause();
        }

        function nextWebampTrack() {
            if (webampInstance) webampInstance.nextTrack();
        }

        function prevWebampTrack() {
            if (webampInstance) webampInstance.previousTrack();
        }
    </script>
</body>
</html>
